<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KBÜ Not Hesaplayıcı</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- Üst Başlık ve Açıklama -->
        <header>
            <h1>KBÜ Not Hesaplayıcı</h1>
            <p>Vize, Final/Bütünleme ve Devamsızlık Durumuna Göre Ders Başarı Notu Hesaplama</p>
        </header>

        <!-- Form Alanı -->
        <form id="notForm" onsubmit="event.preventDefault(); hesapla();">
            <div class="form-group">
                <label for="yilIci">Yıl İçi / Vize Notu (0-100):</label>
                <input type="number" id="yilIci" min="0" max="100" placeholder="Örn: 70">
                <span class="error-message" id="errYilIci"></span>
            </div>

            <div class="form-group">
                <label for="final">Final / Bütünleme Notu (0-100):</label>
                <input type="number" id="final" min="0" max="100" placeholder="Örn: 60">
                <span class="error-message" id="errFinal"></span>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="butunlemeGirilmedi">
                <label for="butunlemeGirilmedi">Bütünleme girilmedi (Yıl içi notu final yerine geçer - %60)</label>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="devamsiz">
                <label for="devamsiz">Devamsız (F1)</label>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="sinavaGirmedim">
                <label for="sinavaGirmedim">Sınava Girmedim / Girmedi (F2)</label>
            </div>

            <div class="btn-group">
                <button type="submit" id="hesaplaBtn">Hesapla</button>
                <button type="button" id="sifirlaBtn" onclick="sifirla()">Sıfırla</button>
            </div>
        </form>

        <!-- Sonuç Kartı -->
        <div id="sonucKarti" class="hidden">
            <h2>Sonuç</h2>
            <div class="result-item"><strong>Başarı Notu:</strong> <span id="resBasariNotu">-</span></div>
            <div class="result-item"><strong>Harf Notu:</strong> <span id="resHarfNotu">-</span></div>
            <div class="result-item"><strong>Durum:</strong> <span id="resDurum">-</span></div>
            <div class="result-item"><strong>Açıklama:</strong> <span id="resAciklama">-</span></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
